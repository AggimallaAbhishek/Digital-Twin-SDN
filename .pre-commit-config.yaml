# Layer L2 of RULEBOOK §7: runs on every `git commit`. Install with `make hooks`.
# Python checks run through `uv run` so they use the project's pinned tool versions.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, auto-fix)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types_or: [python, pyi, toml]
      - id: import-linter
        name: import boundaries (RULEBOOK §4)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types_or: [python, toml]
      - id: fast-tests
        name: fast unit tests
        entry: uv run pytest tests/unit -x -q -m "not vm and not llm and not integration" --no-cov
        language: system
        pass_filenames: false
        types_or: [python, toml]
