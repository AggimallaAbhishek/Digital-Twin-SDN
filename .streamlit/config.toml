# P6.1 dashboard theme (dashboard/app.py), style F "soft modern" (deviation #19): light, so the
# projected demo looks the same on every machine. The page's own colours and their palette
# checks are in dashboard/app.py.
[theme]
base = "light"
backgroundColor = "#F4F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C2433"
primaryColor = "#2A78D6"
font = "sans serif"

[client]
toolbarMode = "minimal"  # no "Deploy" button during the demo

[browser]
gatherUsageStats = false
