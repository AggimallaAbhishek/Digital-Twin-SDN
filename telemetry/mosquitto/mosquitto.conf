# Local development broker (P0.3). Bound to 127.0.0.1 on the host by docker-compose.yml.
# Anonymous access is acceptable ONLY because the port is not exposed beyond localhost.
# Before exposing it to the testbed VM (P2.1), switch to password_file auth (RULEBOOK §14).
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
